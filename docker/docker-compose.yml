services:
  pandownloader:
    image: lis/cloud-drive-downloader:0.14.1
    container_name: pan-downloader
    restart: unless-stopped
    dns:
      - 223.5.5.5
      - 119.29.29.29
    ports:
      - "${PAN_WEB_PORT:-17890}:17890"
    volumes:
      - ${PAN_STATE_DIR:-../state}:/data/state
      - ${PAN_DOWNLOAD_DIR:-../download}:/data/download
    # 需要时在新设备上执行：ssh 到 NAS 后 docker compose up -d
